<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北京时间 · 座钟</title><style>
:root{--paper:#fbfaf7;--ink:#22201c;--soft:#5c584f;--gold:#a9812f;--hair:#e7e2d4}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:40px 20px;background:radial-gradient(circle at 50% 30%,#fff,var(--paper) 55%,#f4f1e9);font-family:serif;color:var(--ink)}.card{position:relative;display:flex;flex-direction:column;align-items:center;padding:56px 64px 42px;background:#fff;border:1px solid var(--hair);border-radius:28px;box-shadow:0 40px 90px -30px #1e190a2e}.card:before{content:"";position:absolute;inset:14px;border:1px solid #d8c48f;border-radius:20px;pointer-events:none}.eyebrow{margin:0 0 24px;color:var(--gold);font-size:12px;letter-spacing:.5em;text-transform:uppercase}.clock{width:min(66vmin,460px);height:min(66vmin,460px)}svg{width:100%;height:100%}.rim{fill:none;stroke:var(--ink);stroke-width:1.5}.gold{fill:none;stroke:var(--gold);stroke-width:1;opacity:.55}.inner,.motif{fill:none;stroke:var(--hair);stroke-width:1}.motif{stroke:#d8c48f}.major{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}.minor{stroke:#c9c4b6;stroke-width:.8}.num{font-size:30px;font-weight:bold;text-anchor:middle;dominant-baseline:central}.hour{stroke:var(--ink);stroke-width:5.5;stroke-linecap:round}.minute{stroke:var(--ink);stroke-width:3.4;stroke-linecap:round}.second{stroke:var(--gold);stroke-width:1.3;stroke-linecap:round}.hub{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}.dot{fill:var(--gold)}.caption{text-align:center;margin-top:28px}.cn{margin:0;font-size:22px;letter-spacing:.4em}.en{margin:8px 0 0;color:var(--soft);font-size:13px;letter-spacing:.25em;text-transform:uppercase}.divider{width:46px;height:1px;margin:16px auto;background:#d8c48f}.digital{margin:0;color:var(--gold);font-size:20px;letter-spacing:.15em}.date{margin:8px 0 0;color:var(--soft);font-size:14px;letter-spacing:.15em}.copy{position:fixed;top:20px;right:20px;padding:9px 12px;border:1px solid var(--hair);border-radius:10px;background:var(--paper);color:var(--soft);cursor:pointer}.copy:hover{color:var(--gold)}@media(max-width:520px){.card{padding:36px 24px 30px}}
</style></head><body><button class="copy" id="copy">复制时间</button><main class="card"><p class="eyebrow">Beijing · Est. UTC+8</p><div class="clock"><svg viewBox="0 0 400 400"><circle class="rim" cx="200" cy="200" r="188"/><circle class="gold" cx="200" cy="200" r="180"/><circle class="inner" cx="200" cy="200" r="164"/><circle class="motif" cx="200" cy="200" r="40"/><g id="ticks"></g><g id="nums"></g><line id="h" class="hour"/><line id="m" class="minute"/><line id="s" class="second"/><circle class="hub" cx="200" cy="200" r="9"/><circle class="dot" cx="200" cy="200" r="3.5"/></svg></div><section class="caption"><p class="cn">北 京 时 间</p><p class="en">China Standard Time</p><div class="divider"></div><p id="time" class="digital">--:--:--</p><p id="date" class="date">----年--月--日 星期-</p></section></main><script>
const N='http://www.w3.org/2000/svg',c=200,days=['日','一','二','三','四','五','六'],rom=['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];for(let i=0;i<60;i++){let a=i*6*Math.PI/180,maj=i%5===0,o=158,n=maj?138:148,l=document.createElementNS(N,'line');l.setAttribute('x1',c+o*Math.sin(a));l.setAttribute('y1',c-o*Math.cos(a));l.setAttribute('x2',c+n*Math.sin(a));l.setAttribute('y2',c-n*Math.cos(a));l.setAttribute('class',maj?'major':'minor');ticks.append(l)}for(let i=0;i<12;i++){let a=i*30*Math.PI/180,t=document.createElementNS(N,'text');t.setAttribute('x',c+112*Math.sin(a));t.setAttribute('y',c-112*Math.cos(a));t.setAttribute('class','num');t.textContent=rom[i];nums.append(t)}let current='';function hand(el,b,f,d){let a=d*Math.PI/180;el.setAttribute('x1',c-b*Math.sin(a));el.setAttribute('y1',c+b*Math.cos(a));el.setAttribute('x2',c+f*Math.sin(a));el.setAttribute('y2',c-f*Math.cos(a))}function pad(n){return String(n).padStart(2,'0')}function update(){let d=new Date(Date.now()+new Date().getTimezoneOffset()*60000+28800000),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();hand(document.querySelector('#h'),18,90,(h%12+m/60)*30);hand(document.querySelector('#m'),22,120,(m+s/60)*6);hand(document.querySelector('#s'),26,138,(s+d.getMilliseconds()/1000)*6);time.textContent=`${pad(h)}:${pad(m)}:${pad(s)}`;date.textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${days[d.getDay()]}`;current=`${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(h)}:${pad(m)}:${pad(s)}`;requestAnimationFrame(update)}update();copy.onclick=async()=>{await navigator.clipboard?.writeText(current);copy.textContent='已复制';setTimeout(()=>copy.textContent='复制时间',1200)};
</script></body></html>
